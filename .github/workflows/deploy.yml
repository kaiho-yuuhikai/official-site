name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 毎日 9:00 JST (0:00 UTC) に note RSS を取得して再デプロイ
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # step の if では secrets も step 自身の env も参照できないため、設定有無の真偽値だけを job レベルで渡す
      # （トークン本体は Threads 取得 step にだけ渡し、npm ci やビルドの step には渡さない）
      HAS_THREADS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # note.com RSS を取得して JSON に保存
      - name: Fetch note RSS
        run: node scripts/fetch-note-rss.mjs

      # Threads 最新投稿を取得して JSON に保存
      - name: Fetch Threads posts
        if: env.HAS_THREADS_TOKEN == 'true'
        # 取得失敗でもデプロイは止めない（コミット済みの JSON にフォールバック）。失敗は警告として残す
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node scripts/fetch-threads-posts.mjs

      - name: Warn when Threads fetch is skipped
        if: env.HAS_THREADS_TOKEN != 'true'
        run: echo "::warning title=Threads::THREADS_ACCESS_TOKEN が未設定のため取得をスキップしました。コミット済みの threads-posts.json を表示します"

      # 寄付集計データを Apps Script Web アプリから取得
      - name: Fetch donations
        env:
          DONATIONS_ENDPOINT_URL: ${{ secrets.DONATIONS_ENDPOINT_URL }}
          DONATIONS_ENDPOINT_TOKEN: ${{ secrets.DONATIONS_ENDPOINT_TOKEN }}
        run: node scripts/fetch-donations.mjs

      # 取得データはリポジトリにコミットしない（main のブランチ保護で push が拒否されるため）。
      # 当日のビルドに載せるだけで、取得に失敗した日は main にコミット済みの JSON がそのまま表示される。

      - name: Build static site
        env:
          NUXT_PUBLIC_GA4_ID: ${{ secrets.NUXT_PUBLIC_GA4_ID }}
        run: npx nuxt generate

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - id: deployment
        uses: actions/deploy-pages@v4
