name: Secret Scan

on:
  push:
    branches: [main]
  # base が main 以外の stacked PR でも検査するため branches フィルタは外す
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PR では merge-base からの差分も検査できるよう履歴を取得
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: 全 tracked ファイルをスキャン
        id: scan-all
        run: node scripts/check-secrets.mjs --all-tracked

      - name: PR 差分のみを追加スキャン (PR の場合)
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Scanning diff: ${BASE_SHA}..${HEAD_SHA}"
          node scripts/check-secrets.mjs --ref "${BASE_SHA}..${HEAD_SHA}"

  # 取引先ドメインのメールアドレスで作られたコミットが入るのを止める。
  # 拒否するドメインは .github/blocked-commit-email-domains.txt で列挙する。
  # 検査するのは今回追加されたコミットだけ（PR は base..head、push は before..after）。過去のコミットは対象外。
  commit-email:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: コミットの作者・コミッターのメールを検査
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # 新規ブランチや force push で push 前のコミットが無いときは、最新の1件だけ見る
            RANGE="-1 ${PUSH_AFTER}"
          else
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "Checking commits: ${RANGE}"
          DOMAINS=$(grep -vE '^\s*(#|$)' .github/blocked-commit-email-domains.txt | tr -d '[:space:]' | tr '\n' ' ' || true)
          if [ -z "$DOMAINS" ]; then echo "拒否ドメインが空のためスキップ"; exit 0; fi
          FOUND=0
          # shellcheck disable=SC2086
          while IFS=' ' read -r sha ae ce; do
            [ -n "$sha" ] || continue
            for d in $DOMAINS; do
              for e in "$ae" "$ce"; do
                e_lc=$(printf '%s' "$e" | tr '[:upper:]' '[:lower:]')
                case "$e_lc" in
                  *@"$d"|*."$d")
                    echo "::error title=取引先ドメインのコミット::${sha} の作者またはコミッターのメールが拒否ドメイン ${d} に一致しました"
                    FOUND=1 ;;
                esac
              done
            done
          done < <(git log --format='%H %ae %ce' $RANGE)
          if [ "$FOUND" -ne 0 ]; then
            echo "取引先ドメインのメールアドレスでコミットしないでください。git config user.email を直し、コミットを作り直してください。"
            exit 1
          fi
          echo "OK"
